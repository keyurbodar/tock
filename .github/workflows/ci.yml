name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bunx tsgo --noEmit -p web/tsconfig.json
      - run: bun --filter @tock/theme check
      - run: bun run check
